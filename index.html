<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f6ff">
  <title>Power BI Portal</title>

  <style>
    :root {
      --bg: #f5f7ff;
      --surface: rgba(255, 255, 255, 0.88);
      --surface-solid: #ffffff;
      --surface-soft: #f3f5fb;
      --text: #16172b;
      --muted: #747b97;
      --border: rgba(110, 118, 155, 0.18);
      --primary: #5b5cf6;
      --primary-dark: #4849d9;
      --cyan: #25c5df;
      --pink: #ff8ec7;
      --success: #2abf88;
      --danger: #de5b6d;
      --shadow: 0 26px 70px rgba(42, 52, 97, 0.16);
      --shadow-soft: 0 14px 34px rgba(42, 52, 97, 0.10);
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    button,
    select {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .app-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 15% 11%, rgba(99, 102, 241, 0.43), transparent 26%),
        radial-gradient(circle at 18% 82%, rgba(255, 142, 199, 0.32), transparent 25%),
        radial-gradient(circle at 86% 86%, rgba(37, 197, 223, 0.42), transparent 28%),
        linear-gradient(140deg, #f8f9ff 0%, #f1f4fc 48%, #f7fbff 100%);
    }

    .app-shell::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(91, 92, 246, 0.09) 0.7px, transparent 0.7px);
      background-size: 22px 22px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,0.28), transparent 70%);
      pointer-events: none;
    }

    .dashboard-header {
      min-height: 76px;
      margin: 18px 18px 0;
      padding: 13px 16px 13px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      background: rgba(255, 255, 255, 0.84);
      border: 1px solid rgba(255, 255, 255, 0.88);
      border-radius: 18px;
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      position: relative;
      z-index: 1;
    }

    .header-brand {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      margin: 0;
      flex: 0 0 auto;
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: #ffffff;
      background: linear-gradient(135deg, var(--primary) 0%, var(--cyan) 100%);
      box-shadow: 0 10px 24px rgba(91, 92, 246, 0.26);
    }

    .brand-mark svg {
      width: 23px;
      height: 23px;
    }

    .header-copy {
      min-width: 0;
    }

    .header-eyebrow {
      margin-bottom: 2px;
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .dashboard-header h3 {
      overflow: hidden;
      color: var(--text);
      font-size: 1rem;
      font-weight: 800;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .header-controls {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }

    .dashboard-selector-wrapper {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 6px 8px 6px 12px;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .dashboard-selector-wrapper span {
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .dashboard-selector {
      max-width: 240px;
      padding: 8px 34px 8px 10px;
      color: var(--text);
      background: #ffffff;
      border: 1px solid #e1e4ef;
      border-radius: 9px;
      outline: none;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }

    .dashboard-selector:focus {
      border-color: rgba(91, 92, 246, 0.52);
      box-shadow: 0 0 0 3px rgba(91, 92, 246, 0.09);
    }

    .header-button {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 15px;
      color: #59617e;
      background: #ffffff;
      border: 1px solid #e0e3ee;
      border-radius: 11px;
      font-size: 0.8rem;
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .header-button svg {
      width: 17px;
      height: 17px;
    }

    .header-button:hover {
      transform: translateY(-1px);
      border-color: #cfd4e4;
      box-shadow: 0 8px 18px rgba(59, 67, 105, 0.09);
    }

    .btn-report {
      color: #5558db;
      background: #f2f1ff;
      border-color: #dddcff;
    }

    /* Option 2 Container Settings */
    .dashboard-frame-shell {
      flex: 1;
      min-height: 0;
      margin: 14px 18px 18px;
      overflow: auto;
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.92);
      border-radius: 20px;
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      position: relative;
      z-index: 1;
    }

    /* Option 2 Iframe Scaling (100% Zoom) */
    #powerbi-frame {
      width: 100%;
      height: 100%;
      min-height: calc(100vh - 126px);
      display: block;
      border: none;
      background: #ffffff;
      zoom: 100%;
      -moz-transform: scale(1.0);
      -moz-transform-origin: 0 0;
    }

    @media (max-width: 860px) {
      .dashboard-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .header-controls {
        width: 100%;
        justify-content: flex-start;
      }

      .dashboard-selector-wrapper {
        flex: 1 1 260px;
      }

      .dashboard-selector {
        width: 100%;
        max-width: none;
      }
    }

    @media (max-width: 600px) {
      .dashboard-header {
        margin: 10px 10px 0;
        padding: 14px;
        border-radius: 16px;
      }

      .dashboard-frame-shell {
        margin: 10px;
        border-radius: 16px;
      }

      #powerbi-frame {
        min-height: calc(100vh - 200px);
      }
    }
  </style>
</head>

<body>
  <main class="app-shell">
    <header class="dashboard-header">
      <div class="header-brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M5 17V11M10 17V7M15 17v-4M20 17V9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>

        <div class="header-copy">
          <div class="header-eyebrow">Power BI Portal</div>
          <h3 id="dashboard-title">Festival Belanja Erafone</h3>
        </div>
      </div>

      <div class="header-controls">
        <div class="dashboard-selector-wrapper">
          <span>Dashboard</span>
          <select id="page-select" class="dashboard-selector" aria-label="Select dashboard page"></select>
        </div>

        <a
          href="https://docs.google.com/forms/d/e/1FAIpQLSe7GOm2OM1Iwt93aCPONnQdoF_UAzNWbDi9mikQSoBEt-HFlg/viewform?usp=publish-editor"
          target="_blank"
          rel="noopener noreferrer"
          class="header-button btn-report"
        >
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 8v5M12 17h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M10.3 4.4 3.8 16a2 2 0 0 0 1.75 3h12.9a2 2 0 0 0 1.75-3L13.7 4.4a2 2 0 0 0-3.4 0Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          </svg>
          Report issue
        </a>
      </div>
    </header>

    <div class="dashboard-frame-shell">
      <iframe
        id="powerbi-frame"
        src=""
        title="Power BI Dashboard"
        allowfullscreen
      ></iframe>
    </div>
  </main>

  <script>
    const POWER_BI_BASE_URL = "https://app.powerbi.com/view?r=eyJrIjoiYzg2M2EzYjQtNjA4NS00NTU3LTg5MjktZWMyODg4MGZhYTQ3IiwidCI6IjU3OGRiYWRkLWMzMmMtNGY1YS04YzQ0LTMzZGE0NGM3MTIwOSIsImMiOjEwfQ%3D%3D";

    const REPORT_PAGES = [
      { name: "Festival Belanja Erafone", sectionId: "f9d2fcc9ec3193ff8959" }
    ];

    const powerBIFrame = document.getElementById("powerbi-frame");
    const pageSelect = document.getElementById("page-select");
    const dashboardTitle = document.getElementById("dashboard-title");

    function initPageMenu() {
      pageSelect.innerHTML = "";

      REPORT_PAGES.forEach((page) => {
        const option = document.createElement("option");
        option.value = page.sectionId
          ? POWER_BI_BASE_URL + "&pageName=" + encodeURIComponent(page.sectionId)
          : POWER_BI_BASE_URL;
        option.textContent = page.name;
        pageSelect.appendChild(option);
      });

      if (REPORT_PAGES.length > 0) {
        powerBIFrame.src = pageSelect.value;
        dashboardTitle.textContent = REPORT_PAGES[0].name;
      }
    }

    function handlePageChange(event) {
      if (event.target.value) {
        powerBIFrame.src = event.target.value;
        dashboardTitle.textContent = event.target.options[event.target.selectedIndex].text;
      }
    }

    pageSelect.addEventListener("change", handlePageChange);
    initPageMenu();
  </script>
</body>
</html>
