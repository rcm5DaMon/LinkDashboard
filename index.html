<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f6ff">
  <title>Analytics Navigation Hub</title>

  <style>
    :root {
      --bg: #f5f7ff;
      --surface: rgba(255, 255, 255, 0.88);
      --surface-hover: rgba(255, 255, 255, 0.96);
      --surface-soft: #f3f5fb;
      --text: #16172b;
      --muted: #747b97;
      --border: rgba(110, 118, 155, 0.18);
      --primary: #5b5cf6;
      --primary-dark: #4849d9;
      --cyan: #25c5df;
      --pink: #ff8ec7;
      --shadow: 0 26px 70px rgba(42, 52, 97, 0.16);
      --shadow-card: 0 8px 24px rgba(42, 52, 97, 0.06);
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    a {
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    .app-shell {
      min-height: 100vh;
      position: relative;
      overflow: hidden;
      display: grid;
      place-items: center;
      padding: 28px;
      background:
        radial-gradient(circle at 15% 11%, rgba(99, 102, 241, 0.43), transparent 26%),
        radial-gradient(circle at 18% 82%, rgba(255, 142, 199, 0.32), transparent 25%),
        radial-gradient(circle at 86% 86%, rgba(37, 197, 223, 0.42), transparent 28%),
        linear-gradient(140deg, #f8f9ff 0%, #f1f4fc 48%, #f7fbff 100%);
    }

    .app-shell::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(91, 92, 246, 0.09) 0.7px, transparent 0.7px);
      background-size: 22px 22px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,0.28), transparent 70%);
      pointer-events: none;
    }

    .hub-container {
      width: min(100%, 480px);
      padding: 42px;
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, 0.78);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      position: relative;
      z-index: 1;
      animation: cardIn 0.6s ease both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(18px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .brand-mark {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      margin-bottom: 24px;
      border-radius: 13px;
      color: #ffffff;
      background: linear-gradient(135deg, var(--primary) 0%, var(--cyan) 100%);
      box-shadow: 0 10px 24px rgba(91, 92, 246, 0.26);
    }

    .brand-mark svg {
      width: 24px;
      height: 24px;
    }

    .hub-container h1 {
      font-size: clamp(1.75rem, 3vw, 2.15rem);
      line-height: 1.1;
      letter-spacing: -0.04em;
      margin-bottom: 8px;
    }

    .hub-description {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .nav-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 20px;
      background: rgba(242, 244, 252, 0.85);
      border: 1px solid #e2e5f0;
      border-radius: var(--radius-md);
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      cursor: pointer;
    }

    .nav-card:hover {
      background: var(--surface-hover);
      border-color: rgba(91, 92, 246, 0.45);
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(78, 94, 234, 0.14);
    }

    .nav-card:active {
      transform: translateY(0);
    }

    .nav-card-info {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .nav-card-icon {
      width: 38px;
      height: 38px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: #ffffff;
      border: 1px solid #e1e4ef;
      color: var(--primary);
      transition: background 0.2s ease, color 0.2s ease;
    }

    .nav-card-icon svg {
      width: 18px;
      height: 18px;
    }

    .nav-card:hover .nav-card-icon {
      background: linear-gradient(135deg, var(--primary) 0%, var(--cyan) 100%);
      border-color: transparent;
      color: #ffffff;
    }

    .nav-card-text {
      min-width: 0;
    }

    .nav-card-tag {
      display: block;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 2px;
    }

    .nav-card-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nav-card-arrow {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      color: #a4aac0;
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .nav-card:hover .nav-card-arrow {
      color: var(--primary);
      transform: translateX(3px);
    }

    .hub-footer {
      margin-top: 28px;
      color: #979db3;
      font-size: 0.76rem;
      text-align: center;
    }

    @media (max-width: 600px) {
      .app-shell {
        padding: 18px;
      }

      .hub-container {
        padding: 30px 20px;
        border-radius: 20px;
      }
    }
  </style>
</head>

<body>
  <main class="app-shell">
    <div class="hub-container">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        </svg>
      </div>

      <h1>Portal Dashboard</h1>
      <p class="hub-description">
        Select a reporting system to open the live analytics dashboard.
      </p>

      <div class="nav-list">
        <!-- Button 1: Sales Performance & Stock -->
        <a href="https://rcm5damon.github.io/DashboardRegion5/" class="nav-card">
          <div class="nav-card-info">
            <div class="nav-card-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M5 17V11M10 17V7M15 17v-4M20 17V9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </div>
            <div class="nav-card-text">
              <span class="nav-card-tag">Regional Portal</span>
              <div class="nav-card-title">Sales Performance & Stock Dashboard</div>
            </div>
          </div>
          <svg class="nav-card-arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>

        <!-- Button 2: Daily Dashboard Region 5 -->
        <a href="https://app.powerbi.com/view?r=eyJrIjoiYzg2M2EzYjQtNjA4NS00NTU3LTg5MjktZWMyODg4MGZhYTQ3IiwidCI6IjU3OGRiYWRkLWMzMmMtNGY1YS04YzQ0LTMzZGE0NGM3MTIwOSIsImMiOjEwfQ%3D%3D" target="_blank" rel="noopener noreferrer" class="nav-card">
          <div class="nav-card-info">
            <div class="nav-card-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M16 11V7a4 4 0 0 0-8 0v4M5 9h14l1 12H4L5 9z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <div class="nav-card-text">
              <span class="nav-card-tag">Power BI Live</span>
              <div class="nav-card-title">Festival Belanja Erafone</div>
            </div>
          </div>
          <svg class="nav-card-arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </div>

      <p class="hub-footer">Authorized operational analytics hub</p>
    </div>
  </main>
</body>
</html>
